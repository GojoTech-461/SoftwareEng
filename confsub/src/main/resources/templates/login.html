<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Log in - ConfSub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 420px;">
    <h1 class="h3 mb-4 text-center">Log in</h1>

    <!-- Messages: ?error, ?logout and ?registered are added to the URL by Spring Security / our controller -->
    <div th:if="${param.error}" class="alert alert-danger">Invalid email or password.</div>
    <div th:if="${param.logout}" class="alert alert-info">You have been logged out.</div>
    <div th:if="${param.registered}" class="alert alert-success">Account created. You can now log in.</div>

    <!-- th:action adds the CSRF token automatically -->
    <form th:action="@{/login}" method="post" class="card card-body shadow-sm">
        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <input type="email" id="email" name="email" class="form-control" required autofocus>
        </div>
        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" id="password" name="password" class="form-control" required>
        </div>
        <button type="submit" class="btn btn-primary w-100">Log in</button>
    </form>

    <p class="text-center mt-3">
        No account? <a th:href="@{/register}">Create one</a>
    </p>
</div>
</body>
</html>
