<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Create an account - ConfSub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container py-5" style="max-width: 520px;">
    <h1 class="h3 mb-4 text-center">Create an account</h1>

    <!-- th:object links the form to the "form" object (RegistrationForm) -->
    <form th:action="@{/register}" th:object="${form}" method="post" class="card card-body shadow-sm" novalidate>

        <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <!-- th:field fills name, id and value; th:errorclass adds the red border if there is an error -->
            <input type="email" th:field="*{email}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{email}"></div>
        </div>

        <div class="row">
            <div class="col mb-3">
                <label for="firstName" class="form-label">First name</label>
                <input type="text" th:field="*{firstName}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{firstName}"></div>
            </div>
            <div class="col mb-3">
                <label for="lastName" class="form-label">Last name</label>
                <input type="text" th:field="*{lastName}" class="form-control" th:errorclass="is-invalid">
                <div class="invalid-feedback" th:errors="*{lastName}"></div>
            </div>
        </div>

        <div class="mb-3">
            <label for="institution" class="form-label">Institution <span class="text-muted">(optional)</span></label>
            <input type="text" th:field="*{institution}" class="form-control">
        </div>

        <div class="mb-3">
            <label for="password" class="form-label">Password</label>
            <input type="password" th:field="*{password}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{password}"></div>
        </div>

        <div class="mb-3">
            <label for="confirmPassword" class="form-label">Confirm password</label>
            <input type="password" th:field="*{confirmPassword}" class="form-control" th:errorclass="is-invalid">
            <div class="invalid-feedback" th:errors="*{confirmPassword}"></div>
        </div>

        <button type="submit" class="btn btn-primary w-100">Create account</button>
    </form>

    <p class="text-center mt-3">
        Already registered? <a th:href="@{/login}">Log in</a>
    </p>
</div>
</body>
</html>
