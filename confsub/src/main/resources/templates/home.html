<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>ConfSub</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
<nav class="navbar navbar-dark bg-dark">
    <div class="container">
        <a class="navbar-brand" th:href="@{/}">ConfSub</a>

        <!-- Visitor: links to login and register -->
        <div th:if="${currentEmail == null}">
            <a class="btn btn-outline-light btn-sm" th:href="@{/login}">Log in</a>
            <a class="btn btn-light btn-sm" th:href="@{/register}">Create account</a>
        </div>

        <!-- Logged-in user: email + logout button (logout must be a POST with CSRF token) -->
        <div th:if="${currentEmail != null}" class="d-flex align-items-center gap-2">
            <span class="text-light" th:text="${currentEmail}"></span>
            <form th:action="@{/logout}" method="post" class="m-0">
                <button type="submit" class="btn btn-outline-light btn-sm">Log out</button>
            </form>
        </div>
    </div>
</nav>

<div class="container py-5">
    <h1>Conference Submission System</h1>
    <p class="lead" th:if="${currentEmail == null}">Welcome! Log in or create an account to submit a paper.</p>
    <p class="lead" th:if="${currentEmail != null}">You are logged in.</p>
</div>
</body>
</html>
