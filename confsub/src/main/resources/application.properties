spring.application.name=confsub
# --- PostgreSQL ---
spring.datasource.url=jdbc:postgresql://localhost:5432/confsub
spring.datasource.username=confsub
spring.datasource.password=confsub

# --- JPA / Hibernate ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true

# --- Upload des PDF (10 Mo max) ---
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=12MB

